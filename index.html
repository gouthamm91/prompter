<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt2JSON Converter</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        h1 {
            text-align: center;
            color: #bb86fc;
            margin-bottom: 30px;
        }
        .converter-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        textarea {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 15px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea#input {
            height: 200px; /* 2.5x the original height */
        }
        textarea#output {
            height: 200px; /* 2.5x the original height */
        }
        textarea:focus {
            outline: none;
            border-color: #bb86fc;
        }
        .btn {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            border-radius: 4px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        .btn:hover {
            background-color: #9a5bf0;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .button-container .btn {
            flex: 1;
        }
        .example {
            background-color: #1e1e1e;
            border-left: 4px solid #bb86fc;
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 8px 8px 0;
        }
        .example h3 {
            margin-top: 0;
            color: #bb86fc;
        }
        .example pre {
            background-color: #2d2d2d;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prompt to JSON Converter</h1>
        <div class="converter-container">
            <textarea id="input" placeholder="Enter your prompt here...">
AIM: 
CONTEXT: 
REQUIREMENT: 
UI/UX: 
LANGUAGES/FRAMEWORKS: 
IMPORTANT_NOTE: Do not use Edit function call to create a new file.
            </textarea>
            <div class="button-container">
                <button class="btn" onclick="convertToJSON()">Convert to JSON</button>
                <button class="btn" onclick="copyToClipboard()">Copy JSON</button>
            </div>
            <textarea id="output" placeholder="JSON output will appear here..." readonly>{"AIM":"","CONTEXT":"","REQUIREMENT":"","UI/UX":"","LANGUAGES/FRAMEWORKS":"","IMPORTANT_NOTE":"Do not use Edit function call to create a new file."}</textarea>
        </div>
        <!-- <div class="example">
            <h3>Example Input:</h3>
            <pre>CONTEXT: Hello.
AIM: Greeting.
RESPONSE: Greet user.</pre>
            <h3>Example Output:</h3>
            <pre>{"CONTEXT": "Hello.", "AIM": "Greeting.", "RESPONSE": "Greet user."}</pre>
        </div> -->
    </div>

    <script>
        function convertToJSON() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            
            // Split the input into lines
            const lines = input.split('\n');
            
            // Create JSON object
            const jsonObject = {};
            
            // Process each line
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line) {
                    // Split on the first colon to separate key and value
                    const colonIndex = line.indexOf(':');
                    if (colonIndex !== -1) {
                        const key = line.substring(0, colonIndex).trim();
                        const value = line.substring(colonIndex + 1).trim();
                        
                        // Replace newlines with \n in the value
                        const escapedValue = value.replace(/\n/g, '\\n');
                        
                        jsonObject[key] = escapedValue;
                    }
                }
            }
            
            // Convert object to JSON string (single line) and display it
            output.value = JSON.stringify(jsonObject).replace(/\\n/g, "\\\\n");
        }
        
        function copyToClipboard() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');
            
            // Optional: Show user feedback
            const originalText = output.value;
            output.value = "Copied to clipboard!";
            setTimeout(() => {
                output.value = originalText;
            }, 2000);
        }
    </script>
</body>
</html>
